<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat — Project 01</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* - Layout ──────────────────────────────────────────────────── */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* - Header ──────────────────────────────────────────────────── */
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 16px;
        }

        header h1 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .model-badge {
            margin-left: auto;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 3px 10px;
            border-radius: 99px;
            border: 1px solid var(--accent);
        }

        /* - Messages area ───────────────────────────────────────────── */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Subtle scrollbar */
        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 2.5rem; }

        .empty-state p {
            font-size: 0.9rem;
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
        }

        /* - Chat bubbles ─────────────────────────────────────────────── */
        .message {
            display: flex;
            gap: 12px;
            max-width: 780px;
            width: 100%;
            animation: fadeUp 0.2s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user  { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .message.user .avatar {
            background: #3b82f6;
            color: #fff;
        }

        .message.assistant .avatar {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent);
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.65;
            max-width: calc(100% - 48px);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .bubble {
            background: #3b82f6;
            color: #fff;
            border-bottom-right-radius: 3px;
        }

        .message.assistant .bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 3px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        /* Blinking cursor shown while AI is streaming */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* - Input area ──────────────────────────────────────────────── */
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            max-width: 780px;
            margin: 0 auto;
        }

        textarea {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            padding: 12px 14px;
            resize: none;
            min-height: 48px;
            max-height: 160px;
            line-height: 1.5;
            transition: border-color 0.15s;
            overflow-y: auto;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea::placeholder { color: var(--text-muted); }

        button#send-btn {
            background: var(--accent);
            border: none;
            border-radius: var(--radius);
            width: 48px;
            height: 48px;
            cursor: pointer;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            transition: opacity 0.15s, transform 0.1s;
        }

        button#send-btn:hover  { opacity: 0.85; }
        button#send-btn:active { transform: scale(0.94); }
        button#send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        button#send-btn svg {
            width: 18px;
            height: 18px;
            stroke: #000;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hint {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- - Header ─────────────────────────────────────────────────────── -->
    <header>
        <div class="logo">✦</div>
        <h1>AI Chat</h1>
        <span class="model-badge">llama3.2:3b · ollama</span>
    </header>

    <!-- - Messages ───────────────────────────────────────────────────── -->
    <div id="messages">
        <div class="empty-state" id="empty-state">
            <span class="icon">◈</span>
            <p>Start a conversation.<br>Running locally on Ollama — no API keys, no cloud.</p>
        </div>
    </div>

    <!-- - Input ──────────────────────────────────────────────────────── -->
    <div class="input-area">
        <div class="input-row">
            <textarea
                id="input"
                placeholder="Ask anything…"
                rows="1"
                autofocus
            ></textarea>
            <button id="send-btn" aria-label="Send message">
                <!-- Arrow-up icon -->
                <svg viewBox="0 0 24 24">
                    <line x1="12" y1="19" x2="12" y2="5"/>
                    <polyline points="5 12 12 5 19 12"/>
                </svg>
            </button>
        </div>
        <p class="hint">Enter ↵ to send &nbsp;·&nbsp; Shift+Enter for new line</p>
    </div>

    <script>
    // - DOM refs ───────────────────────────────────────────────────────────
    const messagesEl  = document.getElementById('messages');
    const emptyState  = document.getElementById('empty-state');
    const inputEl     = document.getElementById('input');
    const sendBtn     = document.getElementById('send-btn');

    // - Auto-resize textarea ───────────────────────────────────────────────
    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });

    // - Enter to send, Shift+Enter for newline ─────────────────────────────
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    // - Append a message bubble to the chat ───────────────────────────────
    function appendMessage(role, content = '') {
        // Hide the empty state once the first message arrives
        if (emptyState) emptyState.style.display = 'none';

        const wrapper = document.createElement('div');
        wrapper.className = `message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? 'U' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = content;

        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        messagesEl.appendChild(wrapper);

        // Keep the latest message in view
        messagesEl.scrollTop = messagesEl.scrollHeight;

        return bubble; // return the bubble so callers can append tokens to it
    }

    // - Main send function ─────────────────────────────────────────────────
    async function sendMessage() {
        const message = inputEl.value.trim();
        if (!message) return;

        // Lock UI while streaming
        inputEl.value = '';
        inputEl.style.height = 'auto';
        sendBtn.disabled = true;
        inputEl.disabled = true;

        // Show the user's message
        appendMessage('user', message);

        // Create the assistant bubble and add a blinking cursor
        const assistantBubble = appendMessage('assistant', '');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        assistantBubble.appendChild(cursor);

        // ── POST to /chat and read the SSE stream ──────────────────────
        //
        // Why not EventSource?
        // EventSource only supports GET requests and can't send a body.
        // We need to POST the user's message, so we use fetch() instead
        // and read the response body as a ReadableStream.
        //
        // This is the "manual SSE" pattern — more code, but you see
        // exactly what's happening at every step.
        try {
            const response = await fetch('/chat', {
                method:  'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body:    `message=${encodeURIComponent(message)}`,
            });

            const reader  = response.body.getReader();
            const decoder = new TextDecoder();
            let   buffer  = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                // Decode the incoming bytes and add to our buffer
                buffer += decoder.decode(value, { stream: true });

                // SSE events are separated by double newlines
                // Process every complete event in the buffer
                const events = buffer.split('\n\n');
                buffer = events.pop(); // keep any incomplete event for next iteration

                for (const event of events) {
                    // Each event line looks like: "data: <json-encoded-string>"
                    if (!event.startsWith('data: ')) continue;

                    const payload = event.slice(6); // strip "data: "

                    // JSON.parse unwraps our server's json.Marshal encoding
                    // e.g.  "\"Hello\\nworld\""  →  "Hello\nworld"
                    const chunk = JSON.parse(payload);

                    if (chunk === '[DONE]') {
                        cursor.remove(); // stream finished — remove blinking cursor
                        break;
                    }

                    // Append the token to the assistant bubble (before the cursor)
                    assistantBubble.insertBefore(
                        document.createTextNode(chunk),
                        cursor
                    );

                    // Keep scrolling to the bottom as tokens arrive
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                }
            }

        } catch (err) {
            cursor.remove();
            assistantBubble.textContent = `⚠ Error: ${err.message}`;
        }

        // Unlock UI
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.focus();
    }
    </script>

</body>
</html>
